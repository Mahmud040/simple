<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Request - BringIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body
    class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased min-h-screen">

    <nav id="navbar"></nav>

    <main class="mx-auto max-w-2xl px-4 py-12">
        <div
            class="bg-white dark:bg-zinc-900 rounded-[32px] border border-zinc-200 dark:border-zinc-800 p-8 shadow-2xl shadow-zinc-200/50 dark:shadow-none">

            <!-- Progress Stepper -->
            <div class="flex items-center justify-between mb-12 relative">
                <div class="absolute top-1/2 left-0 w-full h-1 bg-zinc-100 dark:bg-zinc-800 -translate-y-1/2 -z-10">
                    <div id="step-line-2" class="h-full w-1/2 bg-zinc-100 dark:bg-zinc-800 transition-all duration-500">
                    </div>
                    <div id="step-line-3"
                        class="h-full w-full bg-zinc-100 dark:bg-zinc-800 transition-all duration-500 absolute top-0 left-0 hidden">
                    </div>
                </div>

                <div class="flex flex-col items-center gap-2 bg-white dark:bg-zinc-900 px-2">
                    <div id="step-dot-1"
                        class="h-10 w-10 rounded-full flex items-center justify-center font-bold transition-all duration-300">
                        1</div>
                    <span class="text-[10px] font-bold uppercase tracking-tighter text-zinc-400">Category</span>
                </div>
                <div class="flex flex-col items-center gap-2 bg-white dark:bg-zinc-900 px-2">
                    <div id="step-dot-2"
                        class="h-10 w-10 rounded-full flex items-center justify-center font-bold transition-all duration-300">
                        2</div>
                    <span class="text-[10px] font-bold uppercase tracking-tighter text-zinc-400">Details</span>
                </div>
                <div class="flex flex-col items-center gap-2 bg-white dark:bg-zinc-900 px-2">
                    <div id="step-dot-3"
                        class="h-10 w-10 rounded-full flex items-center justify-center font-bold transition-all duration-300">
                        3</div>
                    <span class="text-[10px] font-bold uppercase tracking-tighter text-zinc-400">Finalize</span>
                </div>
            </div>

            <!-- Step 1: Category -->
            <div id="step-1" class="step-content">
                <h2 class="text-2xl font-bold font-outfit mb-2">What do you need?</h2>
                <p class="text-zinc-500 mb-8">Select a category for your delivery request.</p>

                <div class="grid grid-cols-2 gap-4">
                    <button data-category="Food"
                        class="category-btn p-6 rounded-2xl border-2 border-zinc-100 dark:border-zinc-800 hover:border-emerald-500 transition-all text-left group">
                        <i data-lucide="utensils-cross-lines" class="h-8 w-8 text-emerald-500 mb-4"></i>
                        <span class="block font-bold">Food</span>
                        <span class="text-xs text-zinc-400">Cafeteria, Snacks, etc.</span>
                    </button>
                    <button data-category="Documents"
                        class="category-btn p-6 rounded-2xl border-2 border-zinc-100 dark:border-zinc-800 hover:border-emerald-500 transition-all text-left">
                        <i data-lucide="file-text" class="h-8 w-8 text-blue-500 mb-4"></i>
                        <span class="block font-bold">Documents</span>
                        <span class="text-xs text-zinc-400">Printing, Assignments, etc.</span>
                    </button>
                    <button data-category="Pharmacy"
                        class="category-btn p-6 rounded-2xl border-2 border-zinc-100 dark:border-zinc-800 hover:border-emerald-500 transition-all text-left">
                        <i data-lucide="pill" class="h-8 w-8 text-red-500 mb-4"></i>
                        <span class="block font-bold">Pharmacy</span>
                        <span class="text-xs text-zinc-400">Medicine, First Aid</span>
                    </button>
                    <button data-category="Packages"
                        class="category-btn p-6 rounded-2xl border-2 border-zinc-100 dark:border-zinc-800 hover:border-emerald-500 transition-all text-left">
                        <i data-lucide="package" class="h-8 w-8 text-amber-500 mb-4"></i>
                        <span class="block font-bold">Packages</span>
                        <span class="text-xs text-zinc-400">Gate Pickups, Parcels</span>
                    </button>
                </div>
            </div>

            <!-- Step 2: Details -->
            <div id="step-2" class="step-content hidden">
                <h2 class="text-2xl font-bold font-outfit mb-2">Tell us more</h2>
                <p class="text-zinc-500 mb-8">Provide a clear title and description.</p>

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold mb-2 ml-1">Request Title</label>
                        <input type="text" id="title" placeholder="e.g., Need Coffee from Central Cafeteria"
                            class="w-full px-5 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 ml-1">Description</label>
                        <textarea id="description" rows="4"
                            placeholder="Be specific about what you need and where exactly you are..."
                            class="w-full px-5 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"></textarea>
                    </div>
                </div>
            </div>

            <!-- Step 3: Finalize -->
            <div id="step-3" class="step-content hidden">
                <h2 class="text-2xl font-bold font-outfit mb-2">Almost there</h2>
                <p class="text-zinc-500 mb-8">Set locations and the reward amount.</p>

                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-2 ml-1 text-red-500">Pickup Location</label>
                            <input type="text" id="pickupLocation" placeholder="e.g., Gate 1"
                                class="w-full px-5 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 ml-1 text-emerald-500">Drop-off Location</label>
                            <input type="text" id="dropoffLocation" placeholder="e.g., West Hall"
                                class="w-full px-5 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2 ml-1">
                            <label class="block text-sm font-bold">Reward Amount</label>
                            <span id="reward-display" class="text-lg font-black text-emerald-500 font-outfit">৳50</span>
                        </div>
                        <input type="range" id="reward" min="10" max="200" step="5" value="50"
                            class="w-full h-2 bg-zinc-100 dark:bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                        <div class="flex justify-between text-[10px] text-zinc-400 font-bold mt-2">
                            <span>৳10</span>
                            <span>৳100</span>
                            <span>৳200</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center justify-between mt-12 pt-8 border-t border-zinc-100 dark:border-zinc-800">
                <button id="prev-btn" onclick="CreateRequest.prevStep()"
                    class="flex items-center gap-2 font-bold text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-colors">
                    <i data-lucide="chevron-left" class="h-5 w-5"></i>
                    Back
                </button>

                <button id="next-btn" onclick="CreateRequest.nextStep()"
                    class="flex items-center gap-2 rounded-2xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 px-8 py-3.5 font-bold hover:opacity-90 active:scale-95 transition-all">
                    Continue
                    <i data-lucide="chevron-right" class="h-5 w-5"></i>
                </button>

                <button id="submit-btn" onclick="CreateRequest.submit()"
                    class="hidden flex items-center gap-2 rounded-2xl bg-emerald-500 text-white px-10 py-3.5 font-bold hover:bg-emerald-600 active:scale-95 transition-all shadow-xl shadow-emerald-500/20">
                    Post Request
                    <i data-lucide="send" class="h-4 w-4"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Core Scripts -->
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/create.js"></script>
</body>

</html>
