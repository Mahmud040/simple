<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - CUETConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body
    class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased min-h-screen">

    <nav id="navbar"></nav>

    <main class="mx-auto max-w-4xl px-4 py-10">
        <header class="mb-10">
            <h1 class="text-3xl font-bold font-outfit tracking-tight">Activity Dashboard</h1>
            <p class="text-zinc-500 mt-1">Manage your posted requests and accepted tasks</p>
        </header>

        <!-- Tabs Navigation -->
        <div
            class="flex items-center gap-8 border-b border-zinc-200 dark:border-zinc-800 mb-8 overflow-x-auto no-scrollbar">
            <button onclick="MyRequests.setTab('posted')" data-tab="posted"
                class="tab-btn pb-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap">
                My Posts
            </button>
            <button onclick="MyRequests.setTab('accepted')" data-tab="accepted"
                class="tab-btn pb-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap">
                Tasks I Accepted
            </button>
            <button onclick="MyRequests.setTab('bookmarks')" data-tab="bookmarks"
                class="tab-btn pb-4 text-sm font-bold border-b-2 transition-all whitespace-nowrap">
                Bookmarked
            </button>
        </div>

        <!-- Content Container -->
        <div id="requests-container" class="space-y-4">
            <!-- Content will be injected here by my-requests.js -->
            <div class="animate-pulse space-y-4">
                <div class="h-32 bg-white dark:bg-zinc-900 rounded-3xl border border-zinc-200 dark:border-zinc-800">
                </div>
                <div class="h-32 bg-white dark:bg-zinc-900 rounded-3xl border border-zinc-200 dark:border-zinc-800">
                </div>
            </div>
        </div>
    </main>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/my-requests.js"></script>
</body>

</html>
