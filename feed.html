<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - CUETConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-outfit { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased min-h-screen">
    
    <nav id="navbar"></nav>

    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
            <div>
                <h1 class="text-3xl font-bold font-outfit tracking-tight">Delivery Feed</h1>
                <p class="text-zinc-500 mt-1">Help your peers and earn rewards</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <div class="relative group">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-zinc-400 group-focus-within:text-emerald-500 transition-colors"></i>
                    <input type="text" id="search-input" placeholder="Search requests..." 
                        class="w-full sm:w-72 pl-11 pr-4 py-2.5 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all shadow-sm">
                </div>
                <a href="create.html" class="flex items-center justify-center gap-2 rounded-2xl bg-emerald-500 px-6 py-2.5 text-sm font-bold text-white hover:bg-emerald-600 transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
                    <i data-lucide="plus" class="h-4 w-4"></i>
                    Post Request
                </a>
            </div>
        </div>

        <!-- Categories Filter -->
        <div id="category-filters" class="flex items-center gap-3 overflow-x-auto pb-4 mb-8 scrollbar-hide no-scrollbar">
            <!-- Filter buttons will be injected here -->
        </div>

        <!-- Feed Grid -->
        <div id="request-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Skeleton Loading (Initially visible) -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl border border-zinc-200 dark:border-zinc-800 p-6 animate-pulse">
                <div class="flex items-center gap-3 mb-4">
                    <div class="h-10 w-10 rounded-full bg-zinc-200 dark:bg-zinc-800"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-4 bg-zinc-200 dark:bg-zinc-800 rounded w-3/4"></div>
                        <div class="h-3 bg-zinc-200 dark:bg-zinc-800 rounded w-1/2"></div>
                    </div>
                </div>
                <div class="h-16 bg-zinc-200 dark:bg-zinc-800 rounded mb-6"></div>
                <div class="h-10 bg-zinc-200 dark:bg-zinc-800 rounded"></div>
            </div>
            <div class="bg-white dark:bg-zinc-900 rounded-3xl border border-zinc-200 dark:border-zinc-800 p-6 animate-pulse hidden md:block">
                <div class="flex items-center gap-3 mb-4">
                    <div class="h-10 w-10 rounded-full bg-zinc-200 dark:bg-zinc-800"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-4 bg-zinc-200 dark:bg-zinc-800 rounded w-3/4"></div>
                        <div class="h-3 bg-zinc-200 dark:bg-zinc-800 rounded w-1/2"></div>
                    </div>
                </div>
                <div class="h-16 bg-zinc-200 dark:bg-zinc-800 rounded mb-6"></div>
                <div class="h-10 bg-zinc-200 dark:bg-zinc-800 rounded"></div>
            </div>
        </div>
    </main>

    <!-- Mobile Floating Action Button -->
    <a href="create.html" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-emerald-500 text-white rounded-full shadow-2xl shadow-emerald-500/40 flex items-center justify-center active:scale-90 transition-all z-40">
        <i data-lucide="plus" class="h-7 w-7"></i>
    </a>

    <!-- Core Scripts -->
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/feed.js"></script>
</body>
</html>
