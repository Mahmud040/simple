<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BringIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body
    class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased min-h-screen">

    <nav id="navbar"></nav>

    <main class="mx-auto max-w-4xl px-4 py-10">
        <!-- Profile Header -->
        <div
            class="bg-white dark:bg-zinc-900 rounded-[32px] border border-zinc-200 dark:border-zinc-800 p-8 shadow-2xl shadow-zinc-200/50 dark:shadow-none mb-8">
            <div class="flex flex-col md:flex-row items-center gap-8">
                <div class="relative group">
                    <div id="profile-initial"
                        class="h-28 w-28 rounded-[32px] bg-emerald-500 text-white flex items-center justify-center text-4xl font-black shadow-2xl shadow-emerald-500/30">
                        A
                    </div>
                    <button onclick="window.UI.toast('Photo upload coming soon!', 'info')"
                        class="absolute -bottom-2 -right-2 h-10 w-10 bg-white dark:bg-zinc-800 rounded-2xl border border-zinc-100 dark:border-zinc-700 shadow-xl flex items-center justify-center hover:scale-110 transition-transform">
                        <i data-lucide="camera" class="h-4 w-4 text-emerald-500"></i>
                    </button>
                </div>
                <div class="text-center md:text-left">
                    <h1 id="profile-name-display" class="text-4xl font-bold font-outfit tracking-tight">John Doe</h1>
                    <p id="profile-email-display" class="text-zinc-500 text-lg">name@cuet.ac.bd</p>
                    <div class="mt-4 flex flex-wrap justify-center md:justify-start gap-3">
                        <span
                            class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-600 text-xs font-bold uppercase tracking-wider">CUET
                            Student</span>
                        <span
                            class="px-3 py-1 rounded-full bg-blue-500/10 text-blue-600 text-xs font-bold uppercase tracking-wider border border-blue-500/20 flex items-center gap-1.5">
                            <i data-lucide="shield-check" class="h-3 w-3"></i>
                            Verified
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div
                class="bg-white dark:bg-zinc-900 p-6 rounded-3xl border border-zinc-200 dark:border-zinc-800 text-center">
                <div id="stat-completed" class="text-3xl font-black font-outfit text-zinc-900 dark:text-white">0</div>
                <div class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mt-1">Deliveries</div>
            </div>
            <div
                class="bg-white dark:bg-zinc-900 p-6 rounded-3xl border border-zinc-200 dark:border-zinc-800 text-center">
                <div id="stat-earned" class="text-3xl font-black font-outfit text-emerald-500">৳0</div>
                <div class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mt-1">Total Earned</div>
            </div>
            <div
                class="bg-white dark:bg-zinc-900 p-6 rounded-3xl border border-zinc-200 dark:border-zinc-800 text-center">
                <div id="stat-active" class="text-3xl font-black font-outfit text-zinc-900 dark:text-white">0</div>
                <div class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mt-1">Active Posts</div>
            </div>
            <div
                class="bg-white dark:bg-zinc-900 p-6 rounded-3xl border border-zinc-200 dark:border-zinc-800 text-center">
                <div class="flex items-center justify-center gap-1">
                    <i data-lucide="star" class="h-5 w-5 fill-amber-400 text-amber-400"></i>
                    <span id="stat-rating"
                        class="text-3xl font-black font-outfit text-zinc-900 dark:text-white">4.9</span>
                </div>
                <div class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mt-1">Reputation</div>
            </div>
        </div>

        <!-- Account Details -->
        <div
            class="bg-white dark:bg-zinc-900 rounded-[32px] border border-zinc-200 dark:border-zinc-800 p-8 shadow-xl shadow-zinc-200/50 dark:shadow-none">
            <h2 class="text-2xl font-bold font-outfit mb-6">Account Details</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold mb-2 ml-1">Full Name</label>
                    <input type="text" id="name"
                        class="w-full px-5 py-3 rounded-2xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-100 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2 ml-1">Student ID</label>
                    <input type="text" id="studentId"
                        class="w-full px-5 py-3 rounded-2xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-100 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold mb-2 ml-1">University Email</label>
                    <input type="email" id="email" disabled
                        class="w-full px-5 py-3 rounded-2xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-100 dark:border-zinc-700 opacity-50 cursor-not-allowed">
                </div>
            </div>

            <div class="mt-10 flex items-center justify-end gap-4 border-t border-zinc-100 dark:border-zinc-800 pt-8">
                <button onclick="Auth.logout()"
                    class="px-6 py-3 rounded-2xl font-bold text-red-500 hover:bg-red-50 transition-colors">Logout</button>
                <button id="save-btn" onclick="Profile.saveChanges()"
                    class="px-10 py-3.5 rounded-2xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 font-bold hover:opacity-90 active:scale-95 transition-all shadow-xl shadow-zinc-900/10">
                    Save Changes
                </button>
            </div>
        </div>
    </main>

    <!-- Core Scripts -->
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/profile.js"></script>
</body>

</html>
