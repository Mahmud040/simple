<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - BringIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body
    class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased min-h-screen">

    <nav id="navbar"></nav>

    <main class="mx-auto max-w-4xl px-4 py-10">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-black font-outfit tracking-tight mb-2">Campus Leaders</h1>
            <p class="text-zinc-500">The most active and helpful students in CUET</p>
        </header>

        <!-- Podium Section -->
        <div id="podium-container" class="flex items-end justify-center gap-2 sm:gap-6 mb-16 max-w-2xl mx-auto px-4">
            <!-- Podium will be injected here -->
            <div class="h-48 w-full bg-zinc-100 dark:bg-zinc-900 animate-pulse rounded-t-3xl"></div>
        </div>

        <!-- Leaderboard List -->
        <div
            class="bg-white dark:bg-zinc-900 rounded-[32px] border border-zinc-200 dark:border-zinc-800 p-6 sm:p-8 shadow-2xl shadow-zinc-200/50 dark:shadow-none">
            <div class="flex items-center justify-between mb-8 px-2">
                <h2 class="text-xl font-bold font-outfit">Top Contributors</h2>
                <div class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-zinc-400">
                    <i data-lucide="info" class="h-3 w-3"></i>
                    Updated Daily
                </div>
            </div>

            <div id="leaderboard-list" class="space-y-3">
                <!-- List will be injected here -->
                <div class="h-16 bg-zinc-50 dark:bg-zinc-800 animate-pulse rounded-2xl"></div>
                <div class="h-16 bg-zinc-50 dark:bg-zinc-800 animate-pulse rounded-2xl"></div>
                <div class="h-16 bg-zinc-50 dark:bg-zinc-800 animate-pulse rounded-2xl"></div>
            </div>
        </div>

        <!-- User's Own Rank (Dynamic) -->
        <div id="user-rank-container"
            class="mt-12 p-6 bg-emerald-500 rounded-[32px] text-white shadow-xl shadow-emerald-500/20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div id="user-rank-initial"
                    class="h-12 w-12 rounded-2xl bg-white/20 flex items-center justify-center text-xl font-bold">
                    ?
                </div>
                <div>
                    <h3 id="user-rank-title" class="font-bold">Your Ranking</h3>
                    <p id="user-rank-subtitle" class="text-sm text-emerald-100">Keep delivering to climb the board!</p>
                </div>
            </div>
            <a href="feed.html"
                class="px-6 py-2.5 bg-white text-emerald-600 rounded-xl font-bold text-sm hover:scale-105 transition-transform active:scale-95">
                Start Delivering
            </a>
        </div>
    </main>

    <!-- Core Scripts -->
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/leaderboard.js"></script>
</body>

</html>
