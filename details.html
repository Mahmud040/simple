<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details - CUETConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-outfit { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased min-h-screen">
    
    <nav id="navbar"></nav>

    <main id="details-container" class="mx-auto max-w-4xl px-4 py-12">
        <div class="mb-8">
            <a href="feed.html" class="flex items-center gap-2 text-zinc-500 hover:text-emerald-500 transition-colors font-bold text-sm">
                <i data-lucide="arrow-left" class="h-4 w-4"></i>
                Back to Feed
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Details -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white dark:bg-zinc-900 rounded-[32px] border border-zinc-200 dark:border-zinc-800 p-8 shadow-2xl shadow-zinc-200/50 dark:shadow-none">
                    <div class="flex items-start justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <div id="user-initial" class="h-12 w-12 rounded-2xl bg-emerald-500 text-white flex items-center justify-center font-black text-xl">A</div>
                            <div>
                                <h1 id="title" class="text-2xl font-bold font-outfit leading-tight">...</h1>
                                <p id="posted-by" class="text-xs text-zinc-500 mt-0.5">...</p>
                            </div>
                        </div>
                        <button onclick="Details.toggleBookmark()" class="p-3 rounded-2xl bg-zinc-50 dark:bg-zinc-800 text-zinc-400 hover:text-emerald-500 transition-all">
                            <i id="bookmark-icon" data-lucide="bookmark" class="h-6 w-6"></i>
                        </button>
                    </div>

                    <div class="flex flex-wrap gap-2 mb-8">
                        <span id="category" class="px-4 py-1.5 rounded-full bg-emerald-500/10 text-emerald-600 text-[10px] font-bold uppercase tracking-widest border border-emerald-500/20">Category</span>
                        <span class="px-4 py-1.5 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-500 text-[10px] font-bold uppercase tracking-widest border border-zinc-200 dark:border-zinc-700">Verified Post</span>
                    </div>

                    <div class="prose dark:prose-invert max-w-none">
                        <h3 class="text-sm font-bold uppercase tracking-widest text-zinc-400 mb-4">Description</h3>
                        <p id="description" class="text-lg text-zinc-600 dark:text-zinc-400 leading-relaxed">...</p>
                    </div>

                    <div class="mt-10 pt-10 border-t border-zinc-100 dark:border-zinc-800 grid grid-cols-1 sm:grid-cols-2 gap-8">
                        <div class="flex items-start gap-4">
                            <div class="h-10 w-10 rounded-2xl bg-red-500/10 text-red-500 flex items-center justify-center">
                                <i data-lucide="map-pin" class="h-5 w-5"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold uppercase tracking-widest text-zinc-400 mb-1">Pickup Location</h4>
                                <p id="pickup" class="font-bold">...</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="h-10 w-10 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                                <i data-lucide="navigation" class="h-5 w-5"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold uppercase tracking-widest text-zinc-400 mb-1">Drop-off Location</h4>
                                <p id="dropoff" class="font-bold">...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Action Panel -->
            <div class="space-y-6">
                <div class="bg-white dark:bg-zinc-900 rounded-[32px] border border-zinc-200 dark:border-zinc-800 p-8 shadow-2xl shadow-zinc-200/50 dark:shadow-none sticky top-24">
                    <div class="text-center mb-8">
                        <h4 class="text-xs font-bold uppercase tracking-widest text-zinc-400 mb-2">Delivery Reward</h4>
                        <div id="reward" class="text-5xl font-black font-outfit text-emerald-500">৳...</div>
                    </div>

                    <div id="action-container" class="space-y-4">
                        <!-- Action buttons will be injected here -->
                        <div class="h-14 w-full bg-zinc-100 dark:bg-zinc-800 animate-pulse rounded-2xl"></div>
                    </div>

                    <div class="mt-8 pt-8 border-t border-zinc-100 dark:border-zinc-800 space-y-4">
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-zinc-400">Posted At</span>
                            <span id="posted-at" class="font-bold">...</span>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-zinc-400">Response Time</span>
                            <span class="font-bold text-emerald-500">~15 mins</span>
                        </div>
                    </div>

                    <div class="mt-8 p-4 bg-zinc-50 dark:bg-zinc-800/50 rounded-2xl text-[10px] text-zinc-500 flex gap-3">
                        <i data-lucide="shield-alert" class="h-4 w-4 shrink-0 text-amber-500"></i>
                        <p>Only accept this task if you are physically nearby. Failure to deliver may affect your reputation score.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Core Scripts -->
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/details.js"></script>
</body>
</html>
