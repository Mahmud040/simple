<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BringIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased">

    <nav id="navbar"></nav>

    <div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div
                class="bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl shadow-zinc-200/50 dark:shadow-none border border-zinc-200 dark:border-zinc-800 p-8 md:p-10">

                <div class="text-center mb-8">
                    <div
                        class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-500 text-white mb-4 shadow-lg shadow-emerald-500/20">
                        <i data-lucide="zap" class="h-6 w-6"></i>
                    </div>
                    <h1 class="text-3xl font-bold font-outfit tracking-tight">Welcome Back</h1>
                    <p class="text-zinc-500 mt-2">Log in to your BringIt account</p>
                </div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-semibold mb-2 ml-1">Email Address</label>
                        <input type="email" id="email" required placeholder="name@example.com"
                            class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2 ml-1">
                            <label for="password" class="text-sm font-semibold">Password</label>
                            <a href="#"
                                onclick="event.preventDefault(); window.UI.toast('Please contact admin to reset your password.', 'info')"
                                class="text-xs text-emerald-500 hover:underline">Forgot?</a>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                    </div>

                    <button type="submit" id="login-btn"
                        class="w-full flex items-center justify-center gap-2 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 py-3.5 rounded-xl font-bold hover:opacity-90 active:scale-[0.98] transition-all">
                        <span>Sign In</span>
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-zinc-100 dark:border-zinc-800 text-center">
                    <p class="text-zinc-500">Don't have an account?</p>
                    <a href="signup.html" class="inline-block mt-2 font-bold text-emerald-500 hover:underline">Create a
                        New Account</a>
                </div>

                <div class="mt-6 flex items-center justify-center gap-2 text-xs text-zinc-400">
                    <i data-lucide="shield-check" class="h-3 w-3"></i>
                    Secure for CUET Students only
                </div>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            window.UI.showLoading('login-btn', 'Authenticating...');

            
            setTimeout(() => {
                const result = window.Auth.login(email, password);

                if (result.success) {
                    window.UI.toast('Logged in successfully!', 'success');
                    setTimeout(() => window.location.href = 'feed.html', 1000);
                } else {
                    window.UI.hideLoading('login-btn');
                    window.UI.toast(result.message, 'error');
                }
            }, 800);
        };
    </script>
</body>

</html>
