<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CUETConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased">

    <nav id="navbar"></nav>

    <div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4 py-12">
        <div class="w-full max-w-lg">
            <div
                class="bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl shadow-zinc-200/50 dark:shadow-none border border-zinc-200 dark:border-zinc-800 p-8 md:p-10">

                <div class="text-center mb-8">
                    <div
                        class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-500 text-white mb-4 shadow-lg shadow-emerald-500/20">
                        <i data-lucide="user-plus" class="h-6 w-6"></i>
                    </div>
                    <h1 class="text-3xl font-bold font-outfit tracking-tight">Create Account</h1>
                    <p class="text-zinc-500 mt-2">Join the peer-to-peer network today</p>
                </div>

                <form id="signup-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-sm font-semibold mb-2 ml-1">Full Name</label>
                            <input type="text" id="name" required placeholder="John Doe"
                                class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                        </div>
                        <div>
                            <label for="studentId" class="block text-sm font-semibold mb-2 ml-1">Student ID</label>
                            <input type="text" id="studentId" required placeholder="1904001"
                                class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-semibold mb-2 ml-1">University Email</label>
                        <input type="email" id="email" required placeholder="name@cuet.ac.bd"
                            class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold mb-2 ml-1">Create Password</label>
                        <input type="password" id="password" required placeholder="Min. 8 characters"
                            class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all">
                    </div>

                    <div class="pt-2">
                        <label class="flex items-start gap-3 cursor-pointer group">
                            <input type="checkbox" required
                                class="mt-1 h-4 w-4 rounded border-zinc-300 text-emerald-500 focus:ring-emerald-500">
                            <span class="text-xs text-zinc-500 leading-normal">
                                I agree to the <a href="#" class="text-emerald-500 hover:underline">Terms of Service</a>
                                and confirm I am a current student of CUET.
                            </span>
                        </label>
                    </div>

                    <button type="submit" id="signup-btn"
                        class="w-full flex items-center justify-center gap-2 bg-emerald-500 text-white py-4 rounded-xl font-bold hover:bg-emerald-600 active:scale-[0.98] transition-all shadow-xl shadow-emerald-500/20">
                        <span>Create Account</span>
                        <i data-lucide="arrow-right" class="h-5 w-5"></i>
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-zinc-100 dark:border-zinc-800 text-center">
                    <p class="text-zinc-500">Already have an account?</p>
                    <a href="login.html"
                        class="inline-block mt-2 font-bold text-zinc-900 dark:text-zinc-100 hover:text-emerald-500 transition-colors">Sign
                        In Instead</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="js/lib/db.js"></script>
    <script src="js/lib/auth.js"></script>
    <script src="js/components/ui.js"></script>
    <script src="js/components/navbar.js"></script>
    <script>
        document.getElementById('signup-form').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const password = document.getElementById('password').value;

            // Validate CUET email
            if (!email.endsWith('@cuet.ac.bd')) {
                window.UI.toast('Please use your CUET email (@cuet.ac.bd)', 'error');
                return;
            }

            // Validate password length
            if (password.length < 8) {
                window.UI.toast('Password must be at least 8 characters', 'error');
                return;
            }

            window.UI.showLoading('signup-btn', 'Creating Account...');

            // Simulating a delay
            setTimeout(() => {
                const result = window.Auth.signup(name, email, studentId, password);

                if (result.success) {
                    window.UI.toast('Account created successfully!', 'success');
                    setTimeout(() => window.location.href = 'feed.html', 1000);
                } else {
                    window.UI.hideLoading('signup-btn');
                    window.UI.toast(result.message, 'error');
                }
            }, 1000);
        };
    </script>
</body>

</html>
